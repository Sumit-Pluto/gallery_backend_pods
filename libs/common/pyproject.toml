[project]
name = "crm-common"
version = "0.1.0"
description = "Shared primitives for the CRM AI backend services (schemas, media IO, logging, health, auth)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "Pillow>=10.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crm_common"]
